# Local Postgres for development and tests.
#   docker compose -f docker/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wickermoney
      POSTGRES_USER: wickermoney
      POSTGRES_PASSWORD: wickermoney_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wickermoney-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wickermoney -d wickermoney"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wickermoney-pg:
