name: Package cleanup

# Prunes ghcr.io/wickermoney/wicker-money (and the untagged leftovers of
# wicker-money-preview). The npm packages are not touched.
#
# What is kept, always:
#   :latest  :next  :edge        the three moving tags (their digests are also
#                                passed to snok as skip-shas, belt and braces)
#   every stable version tag     0.4.2, 0.5.0, ...  (self-hosters pin these)
#
# What is deleted:
#   edge-<short sha>             older than 14 days, keeping the newest 10
#   prerelease version tags      0.5.0-rc.1 style, older than 60 days
#   untagged versions            older than 7 days (old :edge images, replaced
#                                :next/:latest images, orphaned previews)
#
# Why 7 days for untagged: release.yml, edge-image.yml and preview-image.yml
# push each architecture by digest, which is untagged until the `merge` job
# tags the manifest list. A cut-off of a few days means an in-flight publish is
# never touched. Do not shorten it below the longest publish run.
#
# Multi-arch safety: snok/container-retention-policy >= v3.1.0 reads the
# manifest of every version it keeps and removes that manifest's per-arch
# children from the delete list. It fails closed (skips the package) if it
# cannot read a manifest. A plain "delete all untagged" would break pulls.
#
# Setup, once:
#   1. Create a secret GHCR_CLEANUP_TOKEN: a classic PAT with delete:packages
#      (and read:packages) from an org owner, or a GitHub App token with
#      packages: write. GITHUB_TOKEN is not enough here: snok's tag wildcards
#      (edge-*) do not work with it.
#   2. Leave the repo variable GHCR_CLEANUP_LIVE unset. Every run is a dry run
#      until it is set to `true`.
#   3. Run Actions -> Package cleanup -> Run workflow, read the log, confirm the
#      "would delete" list contains nothing you want (see the checklist below),
#      then set GHCR_CLEANUP_LIVE=true.
#
# Dry-run checklist:
#   - the versions behind :latest, :next and :edge are not listed
#   - no stable version tag is listed
#   - the per-arch children of a kept :latest are not listed
#   If any of those is wrong, do not go live.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Force a dry run even when GHCR_CLEANUP_LIVE is true
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

# Never two cleanups at once, and never cancel one halfway through.
concurrency:
  group: package-cleanup
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/wickermoney/wicker-money
  # Anything other than an explicit `true` stays a dry run.
  DRY_RUN: ${{ vars.GHCR_CLEANUP_LIVE != 'true' || inputs.dry_run == true }}

jobs:
  cleanup:
    if: github.repository == 'wickermoney/wicker-money'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Digests behind the moving tags, so they cannot be deleted whatever the
      # tag filters below end up matching. A tag that does not exist yet (no
      # prerelease so far means no :next) is skipped.
      - name: Resolve protected digests
        id: protect
        run: |
          shas=""
          for t in latest next edge; do
            d="$(docker buildx imagetools inspect "$IMAGE:$t" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
            if [ -n "$d" ]; then
              echo "$t -> $d"
              shas="${shas:+$shas,}$d"
            else
              echo "::notice::$IMAGE:$t not found, nothing to protect for it"
            fi
          done
          echo "shas=$shas" >> "$GITHUB_OUTPUT"

      - name: edge-<sha> tags (older than 14d, keep newest 10)
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: wickermoney
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          image-names: wicker-money
          image-tags: "edge-*"
          tag-selection: tagged
          cut-off: 14d
          keep-n-most-recent: 10
          skip-shas: ${{ steps.protect.outputs.shas }}
          dry-run: ${{ env.DRY_RUN }}

      # `*.*.*-*` matches 0.5.0-rc.1 and 0.5.0-beta.2; it does not match
      # edge-<sha> (no dots), 0.5.0 (no hyphen), latest, next or edge.
      - name: Prerelease version tags (older than 60d)
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: wickermoney
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          image-names: wicker-money
          image-tags: "*.*.*-*"
          tag-selection: tagged
          cut-off: 60d
          skip-shas: ${{ steps.protect.outputs.shas }}
          dry-run: ${{ env.DRY_RUN }}

      # Last, so the manifests of the versions that survived the two steps above
      # are what snok protects the children of.
      - name: Untagged versions (older than 7d)
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: wickermoney
          token: ${{ secrets.GHCR_CLEANUP_TOKEN }}
          image-names: "wicker-money wicker-money-preview"
          tag-selection: untagged
          cut-off: 7d
          skip-shas: ${{ steps.protect.outputs.shas }}
          dry-run: ${{ env.DRY_RUN }}

      # Cheap tripwire: the moving tags must still resolve after a live run.
      - name: Verify moving tags still pull
        if: env.DRY_RUN != 'true'
        run: |
          for t in latest edge; do
            docker buildx imagetools inspect "$IMAGE:$t" > /dev/null || { echo "::error::$IMAGE:$t no longer resolves"; exit 1; }
          done
